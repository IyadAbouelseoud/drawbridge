# Drawbridge — on-premises deployment, for a broker running this inside their own network.
#
# ---------------------------------------------------------------------------------------
# This file is standalone. It is NOT an overlay on docker-compose.yml.
#
#   docker compose -f docker-compose.onprem.yml --env-file .env.onprem up -d
#
# An overlay would be shorter and would be a trap: `-f a.yml -f b.yml` merges rather than
# replaces, so every bind mount, every published port and every `--reload` in the
# development file survives into the deployment, and forgetting one `-f` deploys the
# development stack under a production name. A deployment file should be readable as the
# whole truth about what runs. This one is.
#
# ---------------------------------------------------------------------------------------
# What is different from development, and why each difference exists.
#
# **No source is mounted.** Development bind-mounts ./services so uvicorn can reload. Here
# the code is what was built into the image, so what is deployed is a thing with a digest
# rather than whatever is checked out on the host. Every third-party image carries its
# digest for the same reason: `n8nio/n8n:1.70.1` is a name its publisher can repoint, and a
# stack that re-pulls on restart is a stack whose contents changed without a commit.
#
# **Nothing is published except the ingress.** Development exposes Postgres on 5432, MinIO
# on 9000, Jaeger on 16686 and five MCP servers on 8101-8105, which is convenient on a
# laptop and is nine unauthenticated services on a broker's LAN. Here, one container binds
# a port and everything else is reachable only from inside the compose network.
#
# **The data plane has no route out.** `drawbridge-data` is `internal: true`: Postgres,
# Redis, MinIO and Vault cannot originate outbound traffic at all. The application
# services sit on both networks and reach the internet through `drawbridge-edge`. This is
# the control that matters most in an exfiltration: the database cannot phone home.
#
# **Secrets come from Vault, and there is no file to fall back to.** No `.secrets.json` is
# mounted. `services/api/src/secrets.py` returns the environment and exactly one backend,
# so an unreachable Vault stops the deployment instead of silently running on stale
# plaintext.
#
# **Identity is Authentik and only Authentik.** `DRAWBRIDGE_OIDC_JWKS_URL` is set, so
# `auth.py` verifies RS256 against a fetched public key and never consults `jwt_secret`.
# Nothing inside this deployment can mint a token, including `make token`. Configure it
# with `python infra/authentik_bootstrap.py`, which prints the three values below.
#
# **`DRAWBRIDGE_ENVIRONMENT=production` is load-bearing.** `check_secret_posture` refuses
# to start when a known development placeholder is configured, rather than warning. A
# control that is present and inert is worse than one that is absent.
#
# **Migrations run as a job, not on boot.** `migrate` runs `alembic upgrade head` and
# exits; the API waits for it to succeed. Migrating from inside the API's lifespan would
# mean N replicas racing the same DDL.
#
# ---------------------------------------------------------------------------------------
# What this file does NOT do, stated rather than implied.
#
# - **It is not highly available.** One Postgres, one Redis, one of everything. A broker
#   who needs HA needs a managed database, not a second container here.
# - **It takes no backups.** `postgres-data` is a volume on one host. The retention
#   obligation under 19 CFR 163 and GCC Art. 175 is years, and a volume is not a backup.
#   That job is not written and is on the roadmap.
# - **It cannot verify its own images.** Every third-party image is pinned to a SHA-256
#   digest, so `docker pull` fetches identical bytes or fails — but a digest says the bytes
#   did not change, not that they were trustworthy when they were recorded. Signature
#   verification (cosign, or a registry policy) is the control that answers that, and it is
#   not here. Refresh the digests with `make pin-images`, which resolves each tag against
#   the registry and rewrites this file; the diff is then something a person reviews.
#
#   Note that a digest and a tag together mean *the digest*: Docker resolves the digest and
#   ignores the tag, so the tag beside each one is documentation for the reader and is not
#   load-bearing. That is deliberate — `redis@sha256:ff02b5...` alone tells nobody what it
#   is, and a digest nobody can read is a digest nobody checks.
# - **Vault runs in dev mode in the `bootstrap` profile only.** The default is an external
#   Vault the broker already operates. See the `vault` service.
#
# Required in .env.onprem — the deployment will not start without them:
#   DRAWBRIDGE_PUBLIC_HOST, VAULT_ADDR, DRAWBRIDGE_VAULT_ROLE_ID, DRAWBRIDGE_VAULT_SECRET_ID,
#   DRAWBRIDGE_OIDC_JWKS_URL, DRAWBRIDGE_JWT_ISSUER, DRAWBRIDGE_PREPARER_NAME
# See .env.onprem.example.

x-hardening: &hardening
  restart: unless-stopped
  # Containers may not gain privileges they did not start with, and start with none.
  # `no-new-privileges` is what stops a setuid binary inside the image from being a path
  # back to root even if everything else here is right.
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  # Logs are rotated in the daemon rather than by a cron job nobody wrote. Without this a
  # container that starts crash-looping fills the host disk, and a full disk takes the
  # database down with it.
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-python-onprem: &python-onprem
  <<: *hardening
  image: drawbridge/api:${DRAWBRIDGE_VERSION:?set DRAWBRIDGE_VERSION}
  # The image ships a uid-10001 user and nothing in it needs to write to its own
  # filesystem. `/tmp` is a tmpfs so pdfplumber and PyMuPDF have scratch space that
  # vanishes with the container.
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  environment: &python-env
    DRAWBRIDGE_ENVIRONMENT: production
    DRAWBRIDGE_LOG_LEVEL: ${DRAWBRIDGE_LOG_LEVEL:-INFO}

    # No password in either DSN. Both are completed from Vault by
    # services/api/src/secrets.py, which is what keeps them out of `docker inspect`.
    DRAWBRIDGE_DATABASE_URL: postgresql+asyncpg://drawbridge_app@postgres:5432/drawbridge
    DRAWBRIDGE_REDIS_URL: redis://redis:6379/0

    DRAWBRIDGE_SECRETS_PROVIDER: vault
    VAULT_ADDR: ${VAULT_ADDR:?set VAULT_ADDR}
    DRAWBRIDGE_VAULT_MOUNT: ${DRAWBRIDGE_VAULT_MOUNT:-secret}
    DRAWBRIDGE_VAULT_PATH: ${DRAWBRIDGE_VAULT_PATH:-drawbridge}
    # role_id is configuration; secret_id is the credential and is injected at deploy
    # time. See infra/vault_bootstrap.py.
    DRAWBRIDGE_VAULT_ROLE_ID: ${DRAWBRIDGE_VAULT_ROLE_ID:?set DRAWBRIDGE_VAULT_ROLE_ID}
    DRAWBRIDGE_VAULT_SECRET_ID: ${DRAWBRIDGE_VAULT_SECRET_ID:?set DRAWBRIDGE_VAULT_SECRET_ID}

    DRAWBRIDGE_S3_ENDPOINT_URL: http://minio:9000
    DRAWBRIDGE_S3_ACCESS_KEY: ${DRAWBRIDGE_S3_ACCESS_KEY:-drawbridge}
    DRAWBRIDGE_S3_BUCKET_DOCUMENTS: drawbridge-documents
    DRAWBRIDGE_S3_BUCKET_ARCHIVE: drawbridge-archive
    DRAWBRIDGE_S3_BUCKET_BACKUPS: drawbridge-backups

    DRAWBRIDGE_OTEL_EXPORTER_ENDPOINT: http://jaeger:4318

    # RS256 against Authentik, and nothing else. With a JWKS URL set, `jwt_secret` is
    # never consulted — see services/api/src/auth.py::_signing_key.
    DRAWBRIDGE_AUTH_REQUIRED: "true"
    DRAWBRIDGE_OIDC_JWKS_URL: ${DRAWBRIDGE_OIDC_JWKS_URL:?set DRAWBRIDGE_OIDC_JWKS_URL}
    DRAWBRIDGE_JWT_ISSUER: ${DRAWBRIDGE_JWT_ISSUER:?set DRAWBRIDGE_JWT_ISSUER}
    DRAWBRIDGE_JWT_AUDIENCE: ${DRAWBRIDGE_JWT_AUDIENCE:-drawbridge-api}

    # White label. The preparer notice on a CBP form is a representation to a customs
    # authority: a licensed broker preparing their own client's claim must not print our
    # disclaimer, and must supply the filer code that makes their own claim checkable.
    # See services/packager/src/branding.py.
    DRAWBRIDGE_PREPARER_NAME: ${DRAWBRIDGE_PREPARER_NAME:?set DRAWBRIDGE_PREPARER_NAME}
    DRAWBRIDGE_PREPARER_IS_LICENSED_BROKER: ${DRAWBRIDGE_PREPARER_IS_LICENSED_BROKER:-false}
    DRAWBRIDGE_PREPARER_FILER_CODE: ${DRAWBRIDGE_PREPARER_FILER_CODE:-}
    DRAWBRIDGE_PREPARER_CONTACT: ${DRAWBRIDGE_PREPARER_CONTACT:-}

    DRAWBRIDGE_MCP_ACE_URL: http://mcp-ace:8101/mcp
    DRAWBRIDGE_MCP_HTS_URL: http://mcp-hts:8102/mcp
    DRAWBRIDGE_MCP_DOCS_URL: http://mcp-docs:8103/mcp
    DRAWBRIDGE_MCP_CLAIMS_URL: http://mcp-claims:8104/mcp
    DRAWBRIDGE_MCP_LEDGER_URL: http://mcp-ledger:8105/mcp
  networks: [edge, data]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

x-mcp-health: &mcp-health
  # A bare GET /mcp is a 400 — it is not a valid MCP request. Liveness means the process
  # answered HTTP at all, not that the status was 2xx.
  test: ["CMD", "sh", "-c", "wget -qO- --timeout=3 http://localhost:$${PORT}/mcp >/dev/null 2>&1 || [ $$? -ne 4 ]"]
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 40s

x-small: &small
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 512M }

services:
  # ------------------------------------------------------------------- ingress
  # The only container that binds a host port. Everything behind it is reachable only
  # from inside the compose network, which is what turns "nine services on the LAN" into
  # one TLS endpoint with an audit log.
  caddy:
    <<: *hardening
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    # Caddy writes its certificate store and needs to bind 443. `read_only` is off here
    # for the certificate store and NET_BIND_SERVICE is added back for the port; both are
    # the minimum this container cannot do without.
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "${DRAWBRIDGE_HTTP_PORT:-80}:80"
      - "${DRAWBRIDGE_HTTPS_PORT:-443}:443"
    environment:
      DRAWBRIDGE_PUBLIC_HOST: ${DRAWBRIDGE_PUBLIC_HOST:?set DRAWBRIDGE_PUBLIC_HOST}
      DRAWBRIDGE_ACME_EMAIL: ${DRAWBRIDGE_ACME_EMAIL:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }

  # ---------------------------------------------------------------- data plane
  postgres:
    <<: *hardening
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    # The owner password reaches Postgres as a file rather than as `POSTGRES_PASSWORD`,
    # so it is not in `docker inspect` and not inherited by the initdb scripts' children.
    environment:
      POSTGRES_USER: drawbridge
      POSTGRES_PASSWORD_FILE: /vault/render/postgres/postgres_password
      POSTGRES_DB: drawbridge
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - render-postgres:/vault/render/postgres:ro
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawbridge -d drawbridge"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    depends_on:
      vault-agent: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 4G }

  redis:
    <<: [*hardening, *small]
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [data]

  minio:
    <<: *hardening
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z@sha256:ac591851803a79aee64bc37f66d77c56b0a4b6e12d9e5356380f4105510f2332
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /vault/render/minio/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /vault/render/minio/minio_root_password
      # No console on a deployment nobody logs into interactively. The bucket layout is
      # created by minio-init below and changed by a migration, not by a person clicking.
      MINIO_BROWSER: "off"
    volumes:
      - render-minio:/vault/render/minio:ro
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [data]
    depends_on:
      vault-agent: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  minio-init:
    <<: [*hardening, *small]
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z@sha256:ba8af71554963bb6ad5c4301ff3d82176e96f0b0c7595047da989cacfae83682
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    volumes:
      - render-minio:/vault/render/minio:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$(cat /vault/render/minio/minio_root_user)" "$$(cat /vault/render/minio/minio_root_password)"
        mc mb --ignore-existing local/drawbridge-documents
        mc mb --ignore-existing local/drawbridge-archive
        mc version enable local/drawbridge-documents
        mc version enable local/drawbridge-archive
        # Object lock is what makes "immutable" true rather than aspirational: with
        # versioning alone, a credential that can write can also delete every version.
        # It cannot be turned on after the fact — a bucket is created locked or is not
        # locked — which is why the backup bucket is created separately and with the flag,
        # and why `--ignore-existing` on a bucket made before week 15 leaves an unlocked
        # one in place. retention.py's put_object fails loudly in that case rather than
        # writing a deletable backup that reads as an immutable one.
        mc mb --ignore-existing --with-lock local/drawbridge-backups
        mc version enable local/drawbridge-backups
        # No lifecycle expiry on the backup bucket. Retention is set per object by
        # retention.py from the statutory obligation, and a bucket-level rule would be a
        # second, quieter answer to "how long is this kept".
        echo "buckets ready — versioned; backups locked, and a correction writes a new object"
    networks: [data]

  # -------------------------------------------------------------------- secrets
  # By default this deployment expects an EXTERNAL Vault the broker already operates, at
  # VAULT_ADDR. This container exists behind the `bootstrap` profile for an evaluation
  # deployment that has none, and it is dev mode: auto-unsealed, in-memory, root token on
  # the command line. Do not run a pilot on it — a restart loses every secret.
  vault:
    <<: [*hardening, *small]
    image: hashicorp/vault:1.15@sha256:0450896c43b13879b19442b204ce29dd19b5a10fce43d5cf38af17da20f56f4d
    profiles: [bootstrap]
    command: ["server", "-dev"]
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-drawbridge-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  # Vault Agent — what removed ./secrets.
  #
  # Six credentials in this deployment are read by images we did not write. Postgres,
  # MinIO and n8n take a password from a file and cannot be taught to call a manager, so
  # until week 15 there were six plaintext files on the host next to this compose file:
  # a second copy of every credential, living as long as the disk, rotated by nobody, and
  # swept up by whatever backs the host up.
  #
  # This logs in with its own AppRole, renders the six values into four tmpfs volumes and
  # keeps them current. Nothing lands on the host filesystem. One credential still has to
  # arrive from outside — the AppRole's own secret_id, which is the chicken-and-egg every
  # secrets manager has — and it comes from the environment rather than from a file, so
  # the directory is gone rather than smaller.
  #
  # It reads a *different Vault path* from the API. `secret/drawbridge` is the
  # application's; `secret/drawbridge-infra` is this one's, and they are disjoint. The API
  # process has no business being able to read the Postgres owner password or the n8n
  # encryption key, and it could not before this file existed — a move into a manager that
  # quietly merged the two would be a downgrade wearing a manager's name.
  vault-agent:
    <<: [*hardening, *small]
    image: hashicorp/vault:1.15@sha256:0450896c43b13879b19442b204ce29dd19b5a10fce43d5cf38af17da20f56f4d
    # The agent needs to lock its memory so a rendered secret cannot be paged to disk,
    # which is the one capability it genuinely cannot do without and the reason `cap_drop:
    # [ALL]` above is followed by exactly one `cap_add`.
    cap_add: [IPC_LOCK]
    read_only: true
    command: ["vault", "agent", "-config=/vault/config/agent.hcl"]
    environment:
      VAULT_ADDR: ${VAULT_ADDR:?set VAULT_ADDR}
      # Interpolated by the templates, so one config file works against the bootstrap
      # Vault and against the broker's own.
      DRAWBRIDGE_VAULT_MOUNT: ${DRAWBRIDGE_VAULT_MOUNT:-secret}
      DRAWBRIDGE_VAULT_INFRA_PATH: ${DRAWBRIDGE_VAULT_INFRA_PATH:-drawbridge-infra}
    secrets: [vault_agent_role_id, vault_agent_secret_id]
    tmpfs: ["/run/vault-agent:size=1m,mode=0700", "/home/vault:size=1m"]
    volumes:
      - ./infra/vault-agent/agent.hcl:/vault/config/agent.hcl:ro
      - ./infra/vault-agent/templates:/vault/templates:ro
      - render-postgres:/vault/render/postgres
      - render-authentik:/vault/render/authentik
      - render-minio:/vault/render/minio
      - render-n8n:/vault/render/n8n
    # Every consumer waits on this healthcheck, so it has to mean "the credentials are
    # there and are credentials" rather than "the process is up". consul-template renders
    # a missing key as the literal `<no value>`, which would otherwise reach Postgres as
    # a password and fail as a wrong password rather than as a missing secret.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          for f in /vault/render/postgres/postgres_password \
                   /vault/render/authentik/postgres_password \
                   /vault/render/authentik/authentik_secret_key \
                   /vault/render/minio/minio_root_user \
                   /vault/render/minio/minio_root_password \
                   /vault/render/n8n/postgres_password \
                   /vault/render/n8n/n8n_encryption_key \
                   /vault/render/n8n/service_token; do
            [ -s "$$f" ] || exit 1
            grep -q '<no value>' "$$f" && exit 1
          done
          exit 0
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [data]

  # ------------------------------------------------------------------- identity
  # Not behind a profile here. In development Authentik is optional because the API falls
  # back to a shared secret; on-prem there is no fallback, so the identity provider is
  # part of the deployment rather than an add-on to it.
  authentik-server:
    <<: *hardening
    image: ghcr.io/goauthentik/server:2025.2@sha256:36233579415aa2e2e52a6b0c45736cb871fe71460bfe0cf95d83f67528fb1182
    command: server
    environment: &authentik-env
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: drawbridge
      AUTHENTIK_POSTGRESQL__PASSWORD_FILE: /vault/render/authentik/postgres_password
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__DB: 1
      AUTHENTIK_SECRET_KEY_FILE: /vault/render/authentik/authentik_secret_key
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    volumes:
      - render-authentik:/vault/render/authentik:ro
      - authentik-media:/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      vault-agent: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks: [edge, data]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  authentik-worker:
    <<: *hardening
    image: ghcr.io/goauthentik/server:2025.2@sha256:36233579415aa2e2e52a6b0c45736cb871fe71460bfe0cf95d83f67528fb1182
    command: worker
    environment: *authentik-env
    volumes:
      - render-authentik:/vault/render/authentik:ro
      - authentik-media:/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      vault-agent: { condition: service_healthy }
    networks: [edge, data]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  # -------------------------------------------------------------- observability
  jaeger:
    <<: *hardening
    image: jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    # No UI port. Traces are an hour of debugging; what has to survive four years is in
    # audit_ledger and carries the trace id. Reach the UI over an SSH tunnel when needed.
    networks: [data]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  # ------------------------------------------------------------- orchestration
  n8n:
    <<: *hardening
    image: n8nio/n8n:1.70.1@sha256:6f9d7b46c1e7299a71aebdc31ae9928395fd2c2d8d9b459b1ae6f75c2b1f0d25
    read_only: false  # n8n writes its own config and task runner state under ~/.n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: drawbridge
      DB_POSTGRESDB_PASSWORD_FILE: /vault/render/n8n/postgres_password
      N8N_PORT: 5678
      N8N_ENCRYPTION_KEY_FILE: /vault/render/n8n/n8n_encryption_key
      N8N_DIAGNOSTICS_ENABLED: "false"
      # n8n 2.x blocks `$env` inside nodes by default, and the workflows read the
      # service token that way. Left at the default, every API call in the pipeline
      # goes out with `Bearer ` and an empty token: the first live run logged
      # "access to env vars denied" and would have failed on 401 at the first node
      # that reached the API. Scoped rather than opened wide — the allowlist below
      # is the only variable a workflow may read.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_VARS_ALLOWLIST: DRAWBRIDGE_SERVICE_TOKEN
      N8N_HIRING_BANNER_ENABLED: "false"
      GENERIC_TIMEZONE: ${DRAWBRIDGE_TIMEZONE:-UTC}
      # Cross-tenant by design: one workflow runs whichever tenant its trigger names.
      # This is the most valuable secret in the deployment; see services/api/src/auth.py.
      DRAWBRIDGE_SERVICE_TOKEN_FILE: /vault/render/n8n/service_token
    volumes:
      - render-n8n:/vault/render/n8n:ro
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres: { condition: service_healthy }
      vault-agent: { condition: service_healthy }
    networks: [edge, data]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  # ---------------------------------------------------------------- app plane
  # Runs once and exits. The API waits for it to complete successfully, so a deployment
  # whose migration fails does not come up serving the previous schema.
  migrate:
    <<: *python-onprem
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *python-env
      # Alembic owns the schema and connects as the owner. The application role cannot
      # create tables, which is the point of having two roles.
      DRAWBRIDGE_OWNER_DATABASE_URL: postgresql+psycopg://drawbridge:@postgres:5432/drawbridge
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *python-onprem
    command:
      - uvicorn
      - services.api.src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${DRAWBRIDGE_API_WORKERS:-4}"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 4G }

  # The drafting worker. One process, polling `review_queue` across every tenant — the
  # only cross-tenant process in the deployment besides n8n. See
  # services/agent/src/worker.py for why it polls and why that is not a compromise.
  agent:
    <<: *python-onprem
    command: ["python", "-m", "services.agent.src.worker"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  # The retention job: a nightly pg_dump into object-locked storage, and the ledger's
  # hash chain recomputed hourly. Weeks 10 through 14 each closed with the same sentence —
  # `postgres-data` is a volume on one host and a volume is not a backup. This is it.
  #
  # It connects as the **owner**, which is the one place in this deployment that is
  # correct rather than a shortcut. `pg_dump` of a database under row-level security run
  # as `drawbridge_app` silently produces a dump of the rows that role can see, which is
  # none of them: a backup that restores to an empty database and reports success. The
  # ledger verification has the same shape — "is the chain intact" cannot be answered by a
  # connection that can only see one tenant.
  #
  # Its own image because of `pg_dump`; see services/backup/Dockerfile.
  backup:
    <<: [*hardening, *small]
    image: drawbridge/backup:${DRAWBRIDGE_VERSION:?set DRAWBRIDGE_VERSION}
    read_only: true
    # The dump is written here before it is hashed and uploaded, so this has to be big
    # enough to hold one compressed dump of the whole database. It is a tmpfs: a backup
    # of a customs record set should not be left on the host's disk after it has been
    # stored somewhere with a retention lock on it.
    tmpfs: ["/tmp:size=${DRAWBRIDGE_BACKUP_TMP_SIZE:-4g},mode=1777"]
    environment:
      <<: *python-env
      DRAWBRIDGE_OWNER_DATABASE_URL: postgresql+psycopg://drawbridge:@postgres:5432/drawbridge
      # Five years, from 19 CFR 163.4 and GCC Art. 175. Raising it is safe; lowering it
      # does nothing to objects already written, because that is what COMPLIANCE mode is.
      DRAWBRIDGE_BACKUP_RETENTION_DAYS: ${DRAWBRIDGE_BACKUP_RETENTION_DAYS:-1830}
      # The scheduled loop also restores a backup into a scratch database once a week and
      # re-verifies every hash chain inside the restored copy. Two consequences worth
      # knowing before the first Sunday: the Postgres volume needs headroom for a second
      # copy of the database for the length of a restore, and the role in the DSN above
      # needs CREATEDB. It is the database owner, so it has it — but a deployment that
      # narrows that role will see the drill fail and the backups keep succeeding, which
      # is the wrong half to lose silently.
      DRAWBRIDGE_BACKUP_DRILL_INTERVAL: ${DRAWBRIDGE_BACKUP_DRILL_INTERVAL:-604800}
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }

  # ---------------------------------------------------------------- MCP plane
  mcp-ace:
    <<: [*python-onprem, *small]
    image: drawbridge/mcp-ace:${DRAWBRIDGE_VERSION:?set DRAWBRIDGE_VERSION}
    command: ["python", "-m", "mcp_servers.mcp_ace.server"]
    environment:
      <<: *python-env
      PORT: "8101"
    # Data plane only. None of the five MCP servers calls anything outside this
    # deployment: they read Postgres and MinIO. Leaving them on `edge` would have given
    # egress to five processes that have no use for it.
    networks: [data]
    healthcheck: *mcp-health

  mcp-hts:
    <<: *python-onprem
    image: drawbridge/mcp-hts:${DRAWBRIDGE_VERSION:?set DRAWBRIDGE_VERSION}
    command: ["python", "-m", "mcp_servers.mcp_hts.server"]
    environment:
      <<: *python-env
      PORT: "8102"
    # Data plane only. None of the five MCP servers calls anything outside this
    # deployment: they read Postgres and MinIO. Leaving them on `edge` would have given
    # egress to five processes that have no use for it.
    networks: [data]
    healthcheck: *mcp-health
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  mcp-docs:
    <<: *python-onprem
    image: drawbridge/mcp-docs:${DRAWBRIDGE_VERSION:?set DRAWBRIDGE_VERSION}
    command: ["python", "-m", "mcp_servers.mcp_docs.server"]
    environment:
      <<: *python-env
      PORT: "8103"
    # Data plane only. None of the five MCP servers calls anything outside this
    # deployment: they read Postgres and MinIO. Leaving them on `edge` would have given
    # egress to five processes that have no use for it.
    networks: [data]
    healthcheck: *mcp-health
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  mcp-claims:
    <<: [*python-onprem, *small]
    image: drawbridge/mcp-claims:${DRAWBRIDGE_VERSION:?set DRAWBRIDGE_VERSION}
    command: ["python", "-m", "mcp_servers.mcp_claims.server"]
    environment:
      <<: *python-env
      PORT: "8104"
    # Data plane only. None of the five MCP servers calls anything outside this
    # deployment: they read Postgres and MinIO. Leaving them on `edge` would have given
    # egress to five processes that have no use for it.
    networks: [data]
    healthcheck: *mcp-health

  mcp-ledger:
    <<: [*python-onprem, *small]
    image: drawbridge/mcp-ledger:${DRAWBRIDGE_VERSION:?set DRAWBRIDGE_VERSION}
    command: ["python", "-m", "mcp_servers.mcp_ledger.server"]
    environment:
      <<: *python-env
      PORT: "8105"
    # Data plane only. None of the five MCP servers calls anything outside this
    # deployment: they read Postgres and MinIO. Leaving them on `edge` would have given
    # egress to five processes that have no use for it.
    networks: [data]
    healthcheck: *mcp-health

# Docker secrets rather than environment variables, for the three credentials that must
# reach a container we did not write. Postgres, MinIO and n8n all read a `_FILE` variant;
# our own services read Vault. Nothing here is in `docker inspect` output.
#
# These files must exist on the host with mode 0400. `infra/vault_bootstrap.py` does not
# write them: a secret that Vault holds and a file on the deployment host are two copies,
# and the point of the file is that these three images cannot be taught to read Vault.
# Two values, and neither is on the host filesystem. Everything that used to be here now
# lives in Vault and reaches its container through vault-agent.
#
# These two are the bootstrap credential — the one thing a secrets manager cannot hand you,
# because it is what you use to ask it for things. `environment:` rather than `file:` so
# ./secrets does not exist at all; Docker still delivers the value as a file on a tmpfs
# inside the container, so it stays out of `docker inspect` and out of the process
# environment where a crash dump or a child process would find it.
#
# role_id is configuration and may be committed. secret_id is a credential, is revocable,
# and is what `python infra/vault_bootstrap.py --infra --rotate` reissues.
secrets:
  vault_agent_role_id:
    environment: DRAWBRIDGE_VAULT_AGENT_ROLE_ID
  vault_agent_secret_id:
    environment: DRAWBRIDGE_VAULT_AGENT_SECRET_ID

volumes:
  # Rendered credentials, one volume per consumer group, all four in RAM. `tmpfs` is the
  # whole point: a credential that never touches a disk cannot be recovered from one, and
  # a host restart leaves nothing behind for the next boot to pick up stale.
  #
  # Per group rather than one shared mount, because a rendered secret should be reachable
  # by the containers that need it and no others. Postgres has no reason to be able to
  # read the n8n encryption key, and one volume for everything would have given it that
  # for the sake of four fewer lines.
  #
  # The files are mode 0644 inside these mounts. That is not weaker than what it replaced
  # — Docker mounts its own secrets 0444 — and the isolation doing the work here is the
  # volume boundary, not the file mode: every process inside a consumer container runs as
  # that service anyway.
  render-postgres: &render
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=1m" }
  render-authentik: *render
  render-minio: *render
  render-n8n: *render

  postgres-data:
  redis-data:
  minio-data:
  n8n-data:
  authentik-media:
  caddy-data:
  caddy-config:

networks:
  # Application services and the ingress. Has a route out, because the extraction path
  # calls api.anthropic.com and Authentik fetches its own updates.
  edge:
    name: drawbridge-edge
    driver: bridge
  # Postgres, Redis, MinIO, Vault and Jaeger. `internal: true` removes the default gateway
  # entirely: these containers cannot originate outbound traffic. It is the cheapest
  # meaningful control in this file — the database cannot be made to phone home.
  data:
    name: drawbridge-data
    driver: bridge
    internal: true
