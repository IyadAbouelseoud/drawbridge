# Drawbridge — development stack.
#
# Week 1 exit gate: `docker compose up` brings every service green.
# Production overlay: docker-compose.prod.yml. On-prem: docker-compose.onprem.yml.

x-python-base: &python-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file: [.env]
  environment:
    DRAWBRIDGE_DATABASE_URL: postgresql+asyncpg://drawbridge:drawbridge@postgres:5432/drawbridge
    DRAWBRIDGE_REDIS_URL: redis://redis:6379/0
    DRAWBRIDGE_S3_ENDPOINT_URL: http://minio:9000
  volumes:
    - ./services:/app/services:ro
    - ./mcp:/app/mcp:ro
    - ./packages:/app/packages:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  networks: [drawbridge]

x-mcp-health: &mcp-health
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  # ---------------------------------------------------------------- data plane
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: drawbridge
      POSTGRES_PASSWORD: drawbridge
      POSTGRES_DB: drawbridge
      # n8n gets its own database inside the same instance; see infra/postgres/init.sql
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawbridge -d drawbridge"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [drawbridge]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [drawbridge]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: drawbridge
      MINIO_ROOT_PASSWORD: drawbridge
    volumes: [minio-data:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [drawbridge]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 drawbridge drawbridge &&
      mc mb --ignore-existing local/drawbridge-documents &&
      mc version enable local/drawbridge-documents &&
      echo 'document bucket ready (versioned - objects are immutable)'
      "
    networks: [drawbridge]

  # ------------------------------------------------------------ orchestration
  n8n:
    image: n8nio/n8n:latest
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: drawbridge
      DB_POSTGRESDB_PASSWORD: drawbridge
      N8N_PORT: 5678
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-only-change-me}
      GENERIC_TIMEZONE: America/New_York
      # n8n holds no business state. It fires transitions against mcp-claims.
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports: ["5678:5678"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [drawbridge]

  # ---------------------------------------------------------------- app plane
  api:
    <<: *python-base
    command:
      ["uvicorn", "services.api.src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------- MCP plane
  mcp-ace:
    <<: *python-base
    command: ["python", "-m", "mcp.mcp_ace.server"]
    ports: ["8101:8101"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8101/mcp"]
      <<: *mcp-health

  mcp-hts:
    <<: *python-base
    command: ["python", "-m", "mcp.mcp_hts.server"]
    ports: ["8102:8102"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8102/mcp"]
      <<: *mcp-health

  mcp-docs:
    <<: *python-base
    command: ["python", "-m", "mcp.mcp_docs.server"]
    ports: ["8103:8103"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8103/mcp"]
      <<: *mcp-health

  mcp-claims:
    <<: *python-base
    command: ["python", "-m", "mcp.mcp_claims.server"]
    ports: ["8104:8104"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8104/mcp"]
      <<: *mcp-health

  mcp-ledger:
    <<: *python-base
    command: ["python", "-m", "mcp.mcp_ledger.server"]
    ports: ["8105:8105"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8105/mcp"]
      <<: *mcp-health

volumes:
  postgres-data:
  redis-data:
  minio-data:
  n8n-data:

networks:
  drawbridge:
    driver: bridge
