# Drawbridge — development stack.
#
# Week 1 exit gate: `docker compose up` brings every service green.
# Production overlay: docker-compose.prod.yml. On-prem: docker-compose.onprem.yml.

# Two database URLs, and the difference between them is the multi-tenancy boundary.
#
# The services connect as `drawbridge_app`: an unprivileged role with neither SUPERUSER nor
# BYPASSRLS, so the row-level security policies from migration b1d6f2c93a47 actually apply
# to it. `drawbridge` owns the tables and is a superuser, which means policies do not apply
# to it at all — every query it makes crosses every tenant. Pointing the services back at
# the owner would leave the policies installed and enforcing nothing, which is worse than
# not having them, so the owner URL is separate and named for what it is.
#
# Run `make rls-bootstrap` once before `make up` on a fresh database: the role is created
# from the environment rather than by a migration, because a migration that creates a login
# role has to put its password in version control.
x-python-base: &python-base
  env_file: [.env]
  environment:
    # No password in this DSN. `app_db_password` is read from the mounted .secrets.json
    # and injected by services/api/src/secrets.py, which keeps it out of `docker inspect`
    # and out of every child process this container spawns.
    DRAWBRIDGE_DATABASE_URL: postgresql+asyncpg://drawbridge_app@postgres:5432/drawbridge
    DRAWBRIDGE_OWNER_DATABASE_URL: postgresql+psycopg://drawbridge:drawbridge@postgres:5432/drawbridge
    DRAWBRIDGE_REDIS_URL: redis://redis:6379/0
    DRAWBRIDGE_SECRETS_FILE: /run/secrets/drawbridge.json
    DRAWBRIDGE_S3_ENDPOINT_URL: http://minio:9000
    DRAWBRIDGE_S3_ACCESS_KEY: drawbridge
    DRAWBRIDGE_S3_BUCKET_DOCUMENTS: drawbridge-documents
    DRAWBRIDGE_S3_BUCKET_ARCHIVE: drawbridge-archive
    # Spans go to Jaeger's OTLP/HTTP receiver. Empty would still be a working stack —
    # the trace id reaches audit_ledger either way; see services/api/src/telemetry.py.
    DRAWBRIDGE_OTEL_EXPORTER_ENDPOINT: http://jaeger:4318
    # Identity. HS256 against a shared secret locally; point DRAWBRIDGE_OIDC_JWKS_URL at
    # Authentik (profile `identity` below) to verify RS256 tokens instead, at which point
    # the secret stops being consulted and nothing here can issue a token.
    DRAWBRIDGE_AUTH_REQUIRED: "${DRAWBRIDGE_AUTH_REQUIRED:-true}"
    DRAWBRIDGE_JWT_ISSUER: drawbridge
    DRAWBRIDGE_JWT_AUDIENCE: drawbridge-api
    DRAWBRIDGE_OIDC_JWKS_URL: ${DRAWBRIDGE_OIDC_JWKS_URL:-}
  volumes:
    - ./services:/app/services:ro
    - ./mcp_servers:/app/mcp_servers:ro
    - ./packages:/app/packages:ro
    # Read-only, and at a path outside the source mounts so an editor watching ./services
    # never sees it. Generate with `make secrets-init`; the stack will not start without
    # it once DRAWBRIDGE_AUTH_REQUIRED is true.
    - ./.secrets.json:/run/secrets/drawbridge.json:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  networks: [drawbridge]

# A bare GET /mcp returns 400 - it is not a valid MCP request. Liveness therefore
# means the process answered HTTP at all, not that the status was 2xx.
x-mcp-health: &mcp-health
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  # ---------------------------------------------------------------- data plane
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: drawbridge
      POSTGRES_PASSWORD: drawbridge
      POSTGRES_DB: drawbridge
      # n8n gets its own database inside the same instance; see infra/postgres/init.sql
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawbridge -d drawbridge"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [drawbridge]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [drawbridge]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: drawbridge
      MINIO_ROOT_PASSWORD: drawbridge
    volumes: [minio-data:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [drawbridge]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 drawbridge drawbridge &&
      mc mb --ignore-existing local/drawbridge-documents &&
      mc version enable local/drawbridge-documents &&
      echo 'document bucket ready (versioned - objects are immutable)'
      "
    networks: [drawbridge]

  # ------------------------------------------------------------ orchestration
  n8n:
    image: n8nio/n8n:latest
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: drawbridge
      DB_POSTGRESDB_PASSWORD: drawbridge
      N8N_PORT: 5678
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-only-change-me}
      GENERIC_TIMEZONE: America/New_York
      # n8n holds no business state. It fires transitions against mcp-claims.
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Every HTTP Request node sends this as a bearer token. It is a *service* token:
      # cross-tenant by design, because one workflow runs whichever tenant its trigger
      # names. Mint it with `make token-service` and treat it as the most valuable secret
      # in the deployment — see services/api/src/auth.py.
      DRAWBRIDGE_SERVICE_TOKEN: ${DRAWBRIDGE_SERVICE_TOKEN:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports: ["5678:5678"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [drawbridge]

  # ------------------------------------------------------------- observability
  # all-in-one rather than a collector plus a backend: one container, OTLP in on 4318,
  # UI out on 16686, and nothing persisted. Traces are for the last hour of debugging;
  # what has to survive four years is in audit_ledger, and it carries the trace id.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP/HTTP
    restart: unless-stopped
    networks: [drawbridge]

  # ------------------------------------------------------------------ identity
  # Behind a profile: `docker compose --profile identity up -d`. Authentik is two
  # containers and wants a database and a cache of its own, which is a lot of stack to
  # carry for a suite that verifies tokens against a shared secret. Bring it up when
  # working on the OIDC path, then set DRAWBRIDGE_OIDC_JWKS_URL and restart the API.
  #
  # It reuses this Postgres instance through its own database (infra/postgres/init.sql)
  # and Redis database 1, so nothing of Authentik's lands in the drawbridge schema.
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.2
    profiles: [identity]
    command: server
    environment: &authentik-env
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: drawbridge
      AUTHENTIK_POSTGRESQL__PASSWORD: drawbridge
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__DB: 1
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-dev-only-change-me}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-drawbridge}
    volumes:
      - authentik-media:/media
    ports: ["9443:9000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [drawbridge]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.2
    profiles: [identity]
    command: worker
    environment: *authentik-env
    volumes:
      - authentik-media:/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [drawbridge]

  # ---------------------------------------------------------------- app plane
  api:
    <<: *python-base
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command:
      ["uvicorn", "services.api.src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------- MCP plane
  mcp-ace:
    <<: *python-base
    build:
      context: .
      dockerfile: mcp_servers/mcp_ace/Dockerfile
    command: ["python", "-m", "mcp_servers.mcp_ace.server"]
    ports: ["8101:8101"]
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "--fail-early", "--connect-timeout", "3", "http://localhost:8101/mcp"]
      <<: *mcp-health

  mcp-hts:
    <<: *python-base
    build:
      context: .
      dockerfile: mcp_servers/mcp_hts/Dockerfile
    command: ["python", "-m", "mcp_servers.mcp_hts.server"]
    ports: ["8102:8102"]
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "--fail-early", "--connect-timeout", "3", "http://localhost:8102/mcp"]
      <<: *mcp-health

  mcp-docs:
    <<: *python-base
    build:
      context: .
      dockerfile: mcp_servers/mcp_docs/Dockerfile
    command: ["python", "-m", "mcp_servers.mcp_docs.server"]
    ports: ["8103:8103"]
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "--fail-early", "--connect-timeout", "3", "http://localhost:8103/mcp"]
      <<: *mcp-health

  mcp-claims:
    <<: *python-base
    build:
      context: .
      dockerfile: mcp_servers/mcp_claims/Dockerfile
    command: ["python", "-m", "mcp_servers.mcp_claims.server"]
    ports: ["8104:8104"]
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "--fail-early", "--connect-timeout", "3", "http://localhost:8104/mcp"]
      <<: *mcp-health

  mcp-ledger:
    <<: *python-base
    build:
      context: .
      dockerfile: mcp_servers/mcp_ledger/Dockerfile
    command: ["python", "-m", "mcp_servers.mcp_ledger.server"]
    ports: ["8105:8105"]
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "--fail-early", "--connect-timeout", "3", "http://localhost:8105/mcp"]
      <<: *mcp-health

volumes:
  authentik-media:
  postgres-data:
  redis-data:
  minio-data:
  n8n-data:

networks:
  drawbridge:
    driver: bridge
