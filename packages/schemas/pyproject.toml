[project]
name = "drawbridge-schemas"
version = "0.1.0"
description = "Shared Pydantic contracts for Drawbridge — single source of truth"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawbridge_schemas"]
