[project]
name = "drawbridge"
version = "0.1.0"
description = "Autonomous customs duty recovery and trade remediation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "boto3>=1.36",
    "httpx>=0.28",
    "structlog>=24.4",
    "anthropic>=0.69",
    "mcp>=1.2",
    "pdfplumber>=0.11",
    "pymupdf>=1.25",
    "pypdf>=5.1",
    "ortools>=9.11",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "hypothesis>=6.123",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-boto3>=1.36",
    "pre-commit>=4.0",
]
ocr = [
    "pillow>=11.0",
    "pytesseract>=0.3.13",
]
embed = [
    "fastembed>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "mcp_servers", "packages/schemas/src/drawbridge_schemas"]

[tool.uv]
package = true

[tool.uv.sources]
drawbridge-schemas = { workspace = true }

[tool.uv.workspace]
members = ["packages/schemas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "mcp_servers", "packages/schemas/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = [
    "A003",
    # RUF001/2/3 flag "ambiguous" Unicode - Arabic-Indic digits mistaken for Latin
    # letters, the Arabic decimal separator mistaken for a comma. Processing exactly
    # those characters is what services/extraction/src/arabic.py exists to do, and the
    # test fixtures must contain real Bayan text. The rule is correct in general and
    # wrong here; suppressing it project-wide beats per-line noqa on every Arabic string.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; reformatting them makes the diff against a regenerated
# migration unreadable. They are machine output, not hand-maintained source.
"services/api/src/migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["drawbridge_schemas", "services", "mcp_servers", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/schemas/src"

# PyMuPDF, the OCR engines and OR-Tools ship no usable type information: PyMuPDF's
# constructors are untyped, and pytesseract/paddleocr have no stubs at all. Their call
# sites are still checked for our own types; only the library boundary is relaxed.
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "fitz.*", "pymupdf.*", "ortools.*", "pytesseract.*", "paddleocr.*", "PIL.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

# Call sites of those libraries. Without this, every pymupdf.open() is a no-untyped-call
# error even though our side of the call is fully annotated.
[[tool.mypy.overrides]]
module = [
    "services.extraction.src.native",
    "services.extraction.src.geometry",
    "services.extraction.src.ocr",
    "mcp_servers.mcp_docs.store",
    "scripts.e2e_pipeline_test",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "golden: known-answer claim fixtures that must reproduce to the cent",
]
