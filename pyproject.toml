[project]
name = "drawbridge"
version = "0.1.0"
description = "Autonomous customs duty recovery and trade remediation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "boto3>=1.36",
    "httpx>=0.28",
    "structlog>=24.4",
    "anthropic>=0.69",
    "mcp>=1.2",
    "pdfplumber>=0.11",
    "pymupdf>=1.25",
    "ortools>=9.11",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "hypothesis>=6.123",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-boto3>=1.36",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "mcp", "packages/schemas/src/drawbridge_schemas"]

[tool.uv]
package = true

[tool.uv.sources]
drawbridge-schemas = { workspace = true }

[tool.uv.workspace]
members = ["packages/schemas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "mcp", "packages/schemas/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["A003"]

[tool.ruff.lint.isort]
known-first-party = ["drawbridge_schemas", "services", "mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/schemas/src"

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "fitz.*", "ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "golden: known-answer claim fixtures that must reproduce to the cent",
]
